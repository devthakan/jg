<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>डिजिटल घोषणापत्र पोर्टल</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070913;
      font-family: sans-serif;
    }
    .loader-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #070913;
      color: #00f2fe;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    .ring {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0, 242, 254, 0.2);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="loader-container" id="pageLoader">
    <div class="ring"></div>
    <p>पोर्टल लोड हो रहा है...</p>
  </div>

  <!-- नीचे अपनी Apps Script Web App URL डालें -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbz6O_eH-qHZz-VJ0OZJRhPmrGxse8RzjY-1sPMUM9R0rPHhTbhOjYk-xbt6MbOzd7DW/exec" 
    allow="clipboard-write; fullscreen"
    onload="document.getElementById('pageLoader').style.opacity='0'; setTimeout(()=>document.getElementById('pageLoader').style.display='none', 500);">
  </iframe>

</body>
</html>
